  <rect x="44" y="28" width="8" height="4" rx="2" fill="black"/>
  
  <!-- Person legs -->
  <rect x="26" y="45" width="4" height="14" rx="2" fill="black"/>
  <rect x="34" y="45" width="4" height="14" rx="2" fill="black"/>
  
