<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Tallest person (adult) -->
  <circle cx="20" cy="10" r="3.5" fill="black"/>
  <rect x="17.5" y="15" width="5" height="18" rx="2.5" fill="black"/>
  <rect x="15" y="34" width="4" height="14" rx="2" fill="black"/>
  <rect x="20" y="34" width="4" height="14" rx="2" fill="black"/>
  
  <!-- Middle person (young adult) -->
  <circle cx="32" cy="12" r="3.2" fill="black"/>
  <rect x="29.8" y="17" width="4.4" height="16" rx="2.2" fill="black"/>
  <rect x="27.5" y="34" width="3.8" height="12" rx="1.9" fill="black"/>
  <rect x="32.2" y="34" width="3.8" height="12" rx="1.9" fill="black"/>
  
  <!-- Shortest person (child) -->
  <circle cx="44" cy="14" r="2.8" fill="black"/>
  <rect x="42" y="19" width="4" height="14" rx="2" fill="black"/>
  <rect x="40" y="34" width="3.4" height="10" rx="1.7" fill="black"/>
  <rect x="44.6" y="34" width="3.4" height="10" rx="1.7" fill="black"/>
  
  <!-- Connection line/group indicator at bottom -->
  <rect x="14" y="46" width="36" height="2" rx="1" fill="black" opacity="0.6"/>
</svg>
