<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Person face (larger) -->
  <circle cx="32" cy="18" r="9" fill="#0388ff"/>
  
  <!-- Person chest/torso (shoulders and chest only) -->
  <path d="M18 30C18 28 24 27 32 27C40 27 46 28 46 30L44 46C44 47.5 39.5 48 32 48C24.5 48 20 47.5 20 46L18 30Z" fill="#0388ff"/>
  
  <!-- Large clock (positioned on right side, overlapping) -->
  <circle cx="44" cy="32" r="10" fill="none" stroke="#0388ff" stroke-width="2"/>
  
  <!-- Clock face background -->
  <circle cx="44" cy="32" r="9" fill="#e8f2ff" opacity="0.3"/>
  
  <!-- Clock hour markers -->
  <circle cx="44" cy="23" r="1" fill="#0388ff"/>
  <circle cx="53" cy="32" r="1" fill="#0388ff"/>
  <circle cx="44" cy="41" r="1" fill="#0388ff"/>
  <circle cx="35" cy="32" r="1" fill="#0388ff"/>
  
  <!-- Clock hour hand (10 o'clock position) -->
  <line x1="44" y1="32" x2="41" y2="26" stroke="#0388ff" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Clock minute hand (2 o'clock position) -->
  <line x1="44" y1="32" x2="50" y2="28" stroke="#0388ff" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Clock center dot -->
  <circle cx="44" cy="32" r="1.5" fill="#0388ff"/>
</svg>
