<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Car body -->
  <rect x="16" y="24" width="32" height="22" rx="3" fill="#0388ff"/>
  
  <!-- Windshield -->
  <path d="M20 24C20 24 22 16 32 16C42 16 44 24 44 24" stroke="#0388ff" stroke-width="2" fill="none" stroke-linecap="round"/>
  <polygon points="20,24 22,16 42,16 44,24" fill="#e8f2ff" opacity="0.4"/>
  
  <!-- Left mirror -->
  <rect x="12" y="26" width="3" height="8" rx="1.5" fill="#0388ff"/>
  
  <!-- Right mirror -->
  <rect x="49" y="26" width="3" height="8" rx="1.5" fill="#0388ff"/>
  
  <!-- Front grill -->
  <rect x="24" y="30" width="16" height="6" rx="1" fill="none" stroke="#0388ff" stroke-width="1.5"/>
  <line x1="28" y1="30" x2="28" y2="36" stroke="#0388ff" stroke-width="1"/>
  <line x1="32" y1="30" x2="32" y2="36" stroke="#0388ff" stroke-width="1"/>
  <line x1="36" y1="30" x2="36" y2="36" stroke="#0388ff" stroke-width="1"/>
  <line x1="40" y1="30" x2="40" y2="36" stroke="#0388ff" stroke-width="1"/>
  
  <!-- Left headlight -->
  <circle cx="20" cy="32" r="3" fill="none" stroke="#0388ff" stroke-width="1.5"/>
  <circle cx="20" cy="32" r="2" fill="#ffd700" opacity="0.6"/>
  
  <!-- Right headlight -->
  <circle cx="44" cy="32" r="3" fill="none" stroke="#0388ff" stroke-width="1.5"/>
  <circle cx="44" cy="32" r="2" fill="#ffd700" opacity="0.6"/>
  
  <!-- Left tire -->
  <circle cx="24" cy="48" r="5" fill="none" stroke="#0388ff" stroke-width="2.5"/>
  <circle cx="24" cy="48" r="3" fill="none" stroke="#0388ff" stroke-width="1.5"/>
  
  <!-- Right tire -->
  <circle cx="40" cy="48" r="5" fill="none" stroke="#0388ff" stroke-width="2.5"/>
  <circle cx="40" cy="48" r="3" fill="none" stroke="#0388ff" stroke-width="1.5"/>
  
  <!-- Bumper/chassis line -->
  <line x1="16" y1="46" x2="48" y2="46" stroke="#0388ff" stroke-width="1.5" stroke-linecap="round"/>
</svg>
