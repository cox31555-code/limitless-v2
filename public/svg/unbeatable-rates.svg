<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ratesGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0388ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#049cff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Piggy bank body -->
  <ellipse cx="32" cy="36" rx="18" ry="16" fill="url(#ratesGrad)" stroke="url(#ratesGrad)" stroke-width="1.5"/>
  
  <!-- Piggy bank head -->
  <circle cx="50" cy="32" r="8" fill="url(#ratesGrad)" stroke="url(#ratesGrad)" stroke-width="1.5"/>
  
  <!-- Snout -->
  <circle cx="58" cy="32" r="3" fill="white"/>
  
  <!-- Legs -->
  <line x1="22" y1="50" x2="22" y2="56" stroke="url(#ratesGrad)" stroke-width="2" stroke-linecap="round"/>
  <line x1="42" y1="50" x2="42" y2="56" stroke="url(#ratesGrad)" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Coin slot on top -->
  <rect x="28" y="20" width="8" height="4" fill="white" rx="1"/>
  
  <!-- Coin falling -->
  <circle cx="32" cy="16" r="2.5" fill="white"/>
</svg>
