<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="carGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0388ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0270cc;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Car body -->
  <path d="M8 34H56V44C56 46.2 54.2 48 52 48H12C9.8 48 8 46.2 8 44V34Z" stroke="url(#carGrad)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Car top/cabin -->
  <path d="M16 24H48C50 24 52 25.5 52 28V34H16V28C16 25.5 17.5 24 20 24Z" stroke="url(#carGrad)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Left wheel -->
  <circle cx="20" cy="48" r="6" stroke="url(#carGrad)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="20" cy="48" r="3" fill="url(#carGrad)"/>
  
  <!-- Right wheel -->
  <circle cx="44" cy="48" r="6" stroke="url(#carGrad)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="44" cy="48" r="3" fill="url(#carGrad)"/>
  
  <!-- Door line -->
  <line x1="32" y1="34" x2="32" y2="44" stroke="url(#carGrad)" stroke-width="1.5" opacity="0.5"/>
  
  <!-- Window outline left -->
  <rect x="18" y="26" width="8" height="6" rx="1" stroke="url(#carGrad)" stroke-width="1.5" fill="none" opacity="0.6"/>
  
  <!-- Window outline right -->
  <rect x="38" y="26" width="8" height="6" rx="1" stroke="url(#carGrad)" stroke-width="1.5" fill="none" opacity="0.6"/>
  
  <!-- Shield/check mark (security indicator) -->
  <path d="M52 22C52 22 56 20 56 16V12C56 12 52 10 52 16V22Z" stroke="url(#carGrad)" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M54 14L56 16L58 14" stroke="url(#carGrad)" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
