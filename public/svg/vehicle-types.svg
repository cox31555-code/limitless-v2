<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="carGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0388ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0270cc;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main car body - large filled rectangle -->
  <rect x="8" y="32" width="48" height="14" rx="2" fill="url(#carGrad)"/>
  
  <!-- Car cabin/top - trapezoid shape -->
  <path d="M16 20L48 20C50 20 52 22 52 24L52 32H12L12 24C12 22 14 20 16 20Z" fill="url(#carGrad)"/>
  
  <!-- Left wheel - big circle with inner fill -->
  <circle cx="16" cy="48" r="7" fill="url(#carGrad)"/>
  <circle cx="16" cy="48" r="4" fill="white" opacity="0.3"/>
  
  <!-- Right wheel - big circle with inner fill -->
  <circle cx="48" cy="48" r="7" fill="url(#carGrad)"/>
  <circle cx="48" cy="48" r="4" fill="white" opacity="0.3"/>
  
  <!-- Door line separator -->
  <line x1="32" y1="32" x2="32" y2="46" stroke="white" stroke-width="1" opacity="0.5"/>
  
  <!-- Front bumper detail -->
  <rect x="8" y="46" width="48" height="2" rx="1" fill="white" opacity="0.4"/>
</svg>
